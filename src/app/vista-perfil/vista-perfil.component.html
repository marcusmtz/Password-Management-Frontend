<div class="max-w-md mx-auto mt-10 p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-4 text-center">
      Perfil de Usuario
    </h2>
  
    <div *ngIf="userProfile" class="flex flex-col items-center gap-4">
      <img
        [src]="userProfile.profilePic || '/img/profilePic.png'"
        alt="Foto de perfil"
        class="rounded-full w-32 h-32 object-cover border-4 border-gray-300 dark:border-gray-600 shadow-sm"
      />
  
      <div class="text-center space-y-1">
        <p class="text-gray-700 dark:text-gray-200"><strong>Usuario:</strong> {{ userProfile.displayName }}</p>
        <p class="text-gray-700 dark:text-gray-200"><strong>Email:</strong> {{ userProfile.email }}</p>
      </div>
  
      <button
        (click)="removeProfilePicture()"
        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition"
      >
        Eliminar foto de perfil
      </button>
  
      <app-upload-profile-pic (imageUploaded)="onImageUploaded($event)"></app-upload-profile-pic>
  
      <div *ngIf="isUploading" class="text-blue-500">Actualizando imagen...</div>
    </div>
  
    <div *ngIf="!userProfile" class="text-center text-red-500 mt-4">
      No se encontró el perfil del usuario.
    </div>
  </div>
