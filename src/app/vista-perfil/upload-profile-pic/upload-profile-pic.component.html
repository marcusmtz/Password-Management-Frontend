<div class="flex flex-col items-center gap-4 p-4 bg-white dark:bg-gray-800 rounded-xl shadow-md w-full max-w-md mx-auto border border-gray-200 dark:border-gray-700">
    <h3 class="text-lg font-semibold text-gray-700 dark:text-white">Actualizar Foto de Perfil</h3>
  
    <!-- Previsualización -->
    <img
      *ngIf="previewUrl"
      [src]="previewUrl"
      alt="Vista previa"
      class="w-32 h-32 rounded-full object-cover border-2 border-gray-300 dark:border-gray-600"
    />
  
    <!-- Input de archivo -->
    <label class="cursor-pointer inline-flex items-center gap-2 text-sm text-blue-600 hover:underline dark:text-blue-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 12v9m0 0l-3-3m3 3l3-3m-6-9l2-2m4 2l2 2M4 6l2-2" />
      </svg>
      Elegir imagen
      <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
    </label>
  
    <!-- Botón subir -->
    <button
      (click)="upload()"
      [disabled]="!selectedFile || uploading"
      class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 transition-all"
    >
      {{ uploading ? "Subiendo..." : "Subir Imagen" }}
    </button>
  
    <!-- Loader -->
    <div *ngIf="uploading" class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300">
      <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8v8H4z"
        ></path>
      </svg>
      Subiendo imagen...
    </div>
  </div>
