    <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-4">All Safes</h2>

    <!-- TABLE -->
    <section class="bg-gray-50 dark:bg-gray-900 p-3 sm:p-5 antialiased">
    <!-- Start coding here -->
    <div
        class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden"
    >
        <div
        class="flex flex-col md:flex-row items-center justify-between space-y-3 md:space-y-0 md:space-x-4 p-4"
        >
        <div class="w-full md:w-1/2">
            <form class="flex items-center">
            <label for="simple-search" class="sr-only">Search</label>
            <div class="relative w-full">
                <div
                class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
                >
                <svg
                    aria-hidden="true"
                    class="w-5 h-5 text-gray-500 dark:text-gray-400"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                    fill-rule="evenodd"
                    d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                    clip-rule="evenodd"
                    />
                </svg>
                </div>
                <input
                type="text"
                [(ngModel)]="searchTerm"
                [ngModelOptions]="{ standalone: true }"
                placeholder="Search by name or directoy"
                class="block w-full px-3 py-2 pl-10 text-sm text-gray-700 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-300"
                />
            </div>
            </form>
        </div>
        <div
            class="w-full md:w-auto flex flex-col md:flex-row space-y-2 md:space-y-0 items-stretch md:items-center justify-end md:space-x-3 flex-shrink-0"
        >
            <button
            type="button"
            id="createProductModalButton"
            data-modal-target="createProductModal"
            data-modal-toggle="createProductModal"
            class="flex items-center justify-center bg-blue-600 text-white focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800 cursor-pointer"
            >
            <svg
                class="h-3.5 w-3.5 mr-2"
                fill="currentColor"
                viewBox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                clip-rule="evenodd"
                fill-rule="evenodd"
                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                />
            </svg>
            Add password
            </button>
        </div>
        </div>
        <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
            <thead
            class="text-xs text-gray-700 uppercase bg-gray-300"
            >
            <tr>
                <th scope="col" class="px-4 py-4">Pasword name</th>
                <th scope="col" class="px-4 py-3">Type Element</th>
                <th scope="col" class="px-4 py-3">Url Website</th>
                <th scope="col" class="px-4 py-3">Description</th>
                <th scope="col" class="px-4 py-3">Directory</th>
                <th scope="col" class="px-4 py-3">
                <span class="sr-only">Actions</span>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr
                *ngFor="let contrasena of paginatedPasswords"
                class="border-b dark:border-gray-700"
            >
                <th
                scope="row"
                class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap dark:text-white"
                >
                {{ contrasena.nombrePsw }}
                </th>
                <td class="px-4 py-3">{{ contrasena.typeElement.name }}</td>
                <td class="px-4 py-3">
                <!-- Contenedor que limita ancho y trunca con puntos suspensivos -->
                <div
                    class="max-w-[200px] truncate inline-block align-middle"
                    title="{{ contrasena.urlWebSite }}"
                >
                    {{ contrasena.urlWebSite }}
                </div>

                <!-- Enlace solo en el ícono -->
                <a
                    [href]="contrasena.urlWebSite"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block align-middle ml-2 text-blue-500 hover:text-blue-700"
                    title="Abrir {{ contrasena.urlWebSite }}"
                >
                    <svg
                    class="size-4 fill-blue-600"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"
                    >
                    <path
                        d="M451.5 160C434.9 160 418.8 164.5 404.7 172.7C388.9 156.7 370.5 143.3 350.2 133.2C378.4 109.2 414.3 96 451.5 96C537.9 96 608 166 608 252.5C608 294 591.5 333.8 562.2 363.1L491.1 434.2C461.8 463.5 422 480 380.5 480C294.1 480 224 410 224 323.5C224 322 224 320.5 224.1 319C224.6 301.3 239.3 287.4 257 287.9C274.7 288.4 288.6 303.1 288.1 320.8C288.1 321.7 288.1 322.6 288.1 323.4C288.1 374.5 329.5 415.9 380.6 415.9C405.1 415.9 428.6 406.2 446 388.8L517.1 317.7C534.4 300.4 544.2 276.8 544.2 252.3C544.2 201.2 502.8 159.8 451.7 159.8zM307.2 237.3C305.3 236.5 303.4 235.4 301.7 234.2C289.1 227.7 274.7 224 259.6 224C235.1 224 211.6 233.7 194.2 251.1L123.1 322.2C105.8 339.5 96 363.1 96 387.6C96 438.7 137.4 480.1 188.5 480.1C205 480.1 221.1 475.7 235.2 467.5C251 483.5 269.4 496.9 289.8 507C261.6 530.9 225.8 544.2 188.5 544.2C102.1 544.2 32 474.2 32 387.7C32 346.2 48.5 306.4 77.8 277.1L148.9 206C178.2 176.7 218 160.2 259.5 160.2C346.1 160.2 416 230.8 416 317.1C416 318.4 416 319.7 416 321C415.6 338.7 400.9 352.6 383.2 352.2C365.5 351.8 351.6 337.1 352 319.4C352 318.6 352 317.9 352 317.1C352 283.4 334 253.8 307.2 237.5z"
                    />
                    </svg>
                </a>
                </td>
                <td class="px-4 py-3 max-w-[12rem] truncate">
                {{ contrasena.description }}
                </td>
                <td class="px-4 py-3">{{ contrasena.directory.name }}</td>
                <td class="px-4 py-3 flex items-center justify-end gap-1 relative">
                <!-- Copy psw button -->
                <button
                    class="border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 hover:bg-gray-100 rounded p-2 transition cursor-pointer"
                    (click)="copyPassword(contrasena.password)"
                >
                    <svg
                    class="size-4 fill-gray-500 group-hover:fill-black transition-colors"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512"
                    >
                    <path
                        d="M384 336l-192 0c-8.8 0-16-7.2-16-16l0-256c0-8.8 7.2-16 16-16l140.1 0L400 115.9 400 320c0 8.8-7.2 16-16 16zM192 384l192 0c35.3 0 64-28.7 64-64l0-204.1c0-12.7-5.1-24.9-14.1-33.9L366.1 14.1c-9-9-21.2-14.1-33.9-14.1L192 0c-35.3 0-64 28.7-64 64l0 256c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64L0 448c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-32-48 0 0 32c0 8.8-7.2 16-16 16L64 464c-8.8 0-16-7.2-16-16l0-256c0-8.8 7.2-16 16-16l32 0 0-48-32 0z"
                    />
                    </svg>
                </button>

                <!-- Copy user button -->
                <button
                    class="border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 hover:bg-gray-100 rounded p-2 transition cursor-pointer"
                    (click)="copyUsername(contrasena.usuario)"
                >
                    <svg
                    class="size-4 fill-gray-500 group-hover:fill-black transition-colors"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512"
                    >
                    <path
                        d="M304 128a80 80 0 1 0 -160 0 80 80 0 1 0 160 0zM96 128a128 128 0 1 1 256 0A128 128 0 1 1 96 128zM49.3 464l349.5 0c-8.9-63.3-63.3-112-129-112l-91.4 0c-65.7 0-120.1 48.7-129 112zM0 482.3C0 383.8 79.8 304 178.3 304l91.4 0C368.2 304 448 383.8 448 482.3c0 16.4-13.3 29.7-29.7 29.7L29.7 512C13.3 512 0 498.7 0 482.3z"
                    />
                    </svg>
                </button>

                <!-- Edit button -->
                <button
                    type="button"
                    [routerLink]="['/vault/edit-password', contrasena.id]"
                    class="border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 hover:bg-gray-100 rounded p-2 transition cursor-pointer"
                >
                    <svg
                    class="w-4 h-4"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                    aria-hidden="true"
                    >
                    <path
                        d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"
                    />
                    <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"
                    />
                    </svg>
                </button>

                <!-- Delete button -->
                <button
                    (click)="deletePassword(contrasena.id)"
                    type="button"
                    class="border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-500 hover:bg-gray-100 rounded p-2 transition cursor-pointer text-red-500"
                >
                    <svg
                    class="w-4 h-4"
                    viewBox="0 0 14 15"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                    >
                    <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        fill="currentColor"
                        d="M6.09922 0.300781C5.93212 0.30087 5.76835 0.347476 5.62625 0.435378C5.48414 0.523281 5.36931 0.649009 5.29462 0.798481L4.64302 2.10078H1.59922C1.36052 2.10078 1.13161 2.1956 0.962823 2.36439C0.79404 2.53317 0.699219 2.76209 0.699219 3.00078C0.699219 3.23948 0.79404 3.46839 0.962823 3.63718C1.13161 3.80596 1.36052 3.90078 1.59922 3.90078V12.9008C1.59922 13.3782 1.78886 13.836 2.12643 14.1736C2.46399 14.5111 2.92183 14.7008 3.39922 14.7008H10.5992C11.0766 14.7008 11.5344 14.5111 11.872 14.1736C12.2096 13.836 12.3992 13.3782 12.3992 12.9008V3.90078C12.6379 3.90078 12.8668 3.80596 13.0356 3.63718C13.2044 3.46839 13.2992 3.23948 13.2992 3.00078C13.2992 2.76209 13.2044 2.53317 13.0356 2.36439C12.8668 2.1956 12.6379 2.10078 12.3992 2.10078H9.35542L8.70382 0.798481C8.62913 0.649009 8.5143 0.523281 8.37219 0.435378C8.23009 0.347476 8.06631 0.30087 7.89922 0.300781H6.09922ZM4.29922 5.70078C4.29922 5.46209 4.39404 5.23317 4.56282 5.06439C4.73161 4.8956 4.96052 4.80078 5.19922 4.80078C5.43791 4.80078 5.66683 4.8956 5.83561 5.06439C6.0044 5.23317 6.09922 5.46209 6.09922 5.70078V11.1008C6.09922 11.3395 6.0044 11.5684 5.83561 11.7372C5.66683 11.906 5.43791 12.0008 5.19922 12.0008C4.96052 12.0008 4.73161 11.906 4.56282 11.7372C4.39404 11.5684 4.29922 11.3395 4.29922 11.1008V5.70078ZM8.79922 4.80078C8.56052 4.80078 8.33161 4.8956 8.16282 5.06439C7.99404 5.23317 7.89922 5.46209 7.89922 5.70078V11.1008C7.89922 11.3395 7.99404 11.5684 8.16282 11.7372C8.33161 11.906 8.56052 12.0008 8.79922 12.0008C9.03791 12.0008 9.26683 11.906 9.43561 11.7372C9.6044 11.5684 9.69922 11.3395 9.69922 11.1008V5.70078C9.69922 5.46209 9.6044 5.23317 9.43561 5.06439C9.26683 4.8956 9.03791 4.80078 8.79922 4.80078Z"
                    />
                    </svg>
                </button>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <nav class="flex items-center justify-between mt-4" *ngIf="totalPages > 1">
        <ul class="inline-flex items-center -space-x-px text-sm">
            <li>
            <button
                (click)="changePage(currentPage - 1)"
                [disabled]="currentPage === 1"
                class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700"
            >
                Previous
            </button>
            </li>

            <li *ngFor="let page of [].constructor(totalPages); let i = index">
            <button
                (click)="changePage(i + 1)"
                [ngClass]="{
                'bg-blue-600 text-white': currentPage === i + 1,
                'bg-white text-gray-500 hover:bg-gray-100 hover:text-gray-700':
                    currentPage !== i + 1
                }"
                class="px-3 py-2 leading-tight border border-gray-300"
            >
                {{ i + 1 }}
            </button>
            </li>

            <li>
            <button
                (click)="changePage(currentPage + 1)"
                [disabled]="currentPage === totalPages"
                class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700"
            >
                Next
            </button>
            </li>
        </ul>
        </nav>
    </div>
    </section>

    <!-- Create modal -->
    <div
    id="createProductModal"
    tabindex="-1"
    aria-hidden="true"
    class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
    >
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div
        class="relative p-4 bg-white rounded-lg shadow dark:bg-gray-800 sm:p-5"
        >
        <!-- Modal header -->
        <div
            class="flex justify-between items-center pb-4 mb-4 rounded-t border-b sm:mb-5 dark:border-gray-600"
        >
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
            Add Password
            </h3>
            <button
            type="button"
            class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white cursor-pointer"
            data-modal-target="createProductModal"
            data-modal-toggle="createProductModal"
            >
            <svg
                aria-hidden="true"
                class="w-5 h-5"
                fill="currentColor"
                viewbox="0 0 20 20"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
                />
            </svg>
            <span class="sr-only">Close modal</span>
            </button>
        </div>
        <!-- Modal body -->
        <form (ngSubmit)="onSubmit()" #passwordForm="ngForm">
            <div class="grid gap-4 mb-4 sm:grid-cols-2">
            <!-- Type of element -->
            <div>
                <label
                for="type"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Type of element</label
                >
                <select
                id="type"
                [(ngModel)]="password.idTypeElement"
                name="idTypeElement"
                required
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                >
                <option [ngValue]="-1" disabled selected>Select type</option>

                <option
                    *ngFor="let type of typesElement; trackBy: trackById"
                    [value]="type.id"
                >
                    {{ type.name }}
                </option>
                </select>
            </div>

            <!-- Favorite -->
            <div>
                <label
                for="isFavorite"
                class="block mb-4 text-sm font-medium text-gray-900 dark:text-white"
                >Mark as favorite?</label
                >
                <div class="flex items-center">
                <input
                    id="isFavorite"
                    type="checkbox"
                    [(ngModel)]="password.isFavorite"
                    name="isFavorite"
                    class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600"
                />
                <label
                    for="isFavorite"
                    class="ms-2 text-sm font-medium text-gray-700 dark:text-gray-300"
                    >Favorite</label
                >
                </div>
            </div>

            <!-- Name -->
            <div>
                <label
                for="nombrePsw"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Name</label
                >
                <input
                type="text"
                [(ngModel)]="password.nombrePsw"
                name="nombrePsw"
                id="nombrePsw"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Type password name"
                required
                />
            </div>

            <!-- Directory -->
            <div>
                <label for="directory" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                  Directory
                </label>
                <select
                  id="directory"
                  [(ngModel)]="password.idDirectory"
                  name="idDirectory"
                  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                >
                  <option [ngValue]="-1" disabled selected>
                    Select Directory
                  </option>
                  <option *ngFor="let dir of directories; trackBy: trackById" [value]="dir.id">
                    {{ dir.name }}
                  </option>
                </select>
              </div>
            

            <!-- User -->
            <div>
                <label
                for="usuario"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >User</label
                >
                <input
                type="text"
                [(ngModel)]="password.usuario"
                name="usuario"
                id="usuario"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Type username"
                required
                />
            </div>

            <!-- URL -->
            <div>
                <label
                for="urlWebSite"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Url Website</label
                >
                <input
                type="text"
                [(ngModel)]="password.urlWebSite"
                name="urlWebSite"
                id="urlWebSite"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Type url"
                required
                />
            </div>

            <!-- Password -->
            <div>
                <label
                for="password"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >
                Password
                </label>

                <div class="relative">
                <input
                    [type]="showPassword ? 'text' : 'password'"
                    name="password"
                    id="password"
                    [(ngModel)]="password.password"
                    (ngModelChange)="evaluatePasswordStrength($event)"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 pr-10 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                    placeholder="Type password"
                    required
                />

                <!-- Botón del ojito -->
                <button
                    type="button"
                    (click)="togglePasswordVisibility()"
                    class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-600 dark:text-gray-300"
                    aria-label="Toggle password visibility"
                >
                    <svg
                    *ngIf="showPassword"
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                    </svg>
                    <svg
                    *ngIf="!showPassword"
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-5 h-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.27-2.944-9.542-7a10.054 10.054 0 012.172-3.317M6.423 6.423A9.964 9.964 0 0112 5c4.478 0 8.27 2.944 9.542 7a9.97 9.97 0 01-4.125 5.272M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 3l18 18"
                    />
                    </svg>
                </button>
                </div>

                <!-- Medidor de fuerza -->
                <div *ngIf="password.password" class="mt-2">
                <div class="w-full h-2 bg-gray-200 rounded">
                    <div
                    [ngClass]="{
                        'bg-red-500': passwordStrength === 0,
                        'bg-orange-400': passwordStrength === 1,
                        'bg-yellow-400': passwordStrength === 2,
                        'bg-blue-400': passwordStrength === 3,
                        'bg-green-500': passwordStrength === 4
                    }"
                    class="h-full rounded transition-all duration-300"
                    [style.width.%]="(passwordStrength + 1) * 20"
                    ></div>
                </div>
                <p
                    class="text-sm mt-1"
                    [ngClass]="{
                    'text-red-500': passwordStrength <= 1,
                    'text-yellow-600': passwordStrength === 2,
                    'text-blue-600': passwordStrength === 3,
                    'text-green-600': passwordStrength === 4
                    }"
                >
                    {{ passwordFeedback }}
                </p>
                </div>
            </div>

            <!-- Description -->
            <div class="sm:col-span-2">
                <label
                for="description"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Description</label
                >
                <textarea
                id="description"
                [(ngModel)]="password.description"
                name="description"
                rows="4"
                class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Write description here"
                ></textarea>
            </div>
            </div>

            <!-- Submit Button -->
            <button
            type="submit"
            data-modal-hide="createProductModal"
            class="bg-blue-600 text-white cursor-pointer inline-flex items-center focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800"
            >
            <svg
                class="mr-1 -ml-1 w-6 h-6"
                fill="currentColor"
                viewBox="0 0 20 20"
            >
                <path
                fill-rule="evenodd"
                d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                clip-rule="evenodd"
                />
            </svg>
            Add new password
            </button>
        </form>
        </div>
    </div>
    </div>
