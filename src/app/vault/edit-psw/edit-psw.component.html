    <section class="bg-white dark:bg-gray-900">
    <div class="py-8 px-4 mx-auto max-w-2xl lg:py-16">
        <h2 class="mb-4 text-xl font-bold text-gray-900 dark:text-white">
        Edit Password
        </h2>
        <form #form="ngForm">
        <div class="grid gap-4 sm:grid-cols-2 sm:gap-6">
            <div class="w-full">
            <label
                for="name"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Name</label
            >
            <input
                [(ngModel)]="passwordData.nombrePsw"
                name="nombrePsw"
                type="text"
                id="name"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                placeholder="Website or service name"
            />
            </div>

            <div>
                <label for="isFavorite" class="block mb-4 text-sm font-medium text-gray-900 dark:text-white">Mark as favorite?</label>
                <div class="flex items-center">
                <input
                    [(ngModel)]="passwordData.favorite"
                    name="favorite"
                    id="isFavorite"
                    type="checkbox"
                    class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" />
                <label for="isFavorite" class="ms-2 text-sm font-medium text-gray-700 dark:text-gray-300">Favorite</label>
                </div>
            </div>

            <div class="w-full">
            <label
                for="username"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Username</label
            >
            <input
                [(ngModel)]="passwordData.usuario"
                name="usuario"
                type="text"
                id="username"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                placeholder="example@email.com"
            />
            </div>

            <div class="w-full">
            <label
                for="password"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
            >
                Password
            </label>

            <div class="relative">
                <input
                [(ngModel)]="passwordData.password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                (ngModelChange)="evaluatePasswordStrength($event)"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full pr-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                placeholder="Type password"
                required
                />
                <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-600 dark:text-gray-300"
                aria-label="Toggle password visibility"
                >
                

                <svg *ngIf="!showPassword" class="w-5 h-5 fill-current cursor-pointer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M288 80c-65.2 0-118.8 29.6-159.9 67.7C89.6 183.5 63 226 49.4 256c13.6 30 40.2 72.5 78.6 108.3C169.2 402.4 222.8 432 288 432s118.8-29.6 159.9-67.7C486.4 328.5 513 286 526.6 256c-13.6-30-40.2-72.5-78.6-108.3C406.8 109.6 353.2 80 288 80zM95.4 112.6C142.5 68.8 207.2 32 288 32s145.5 36.8 192.6 80.6c46.8 43.5 78.1 95.4 93 131.1c3.3 7.9 3.3 16.7 0 24.6c-14.9 35.7-46.2 87.7-93 131.1C433.5 443.2 368.8 480 288 480s-145.5-36.8-192.6-80.6C48.6 356 17.3 304 2.5 268.3c-3.3-7.9-3.3-16.7 0-24.6C17.3 208 48.6 156 95.4 112.6zM288 336c44.2 0 80-35.8 80-80s-35.8-80-80-80c-.7 0-1.3 0-2 0c1.3 5.1 2 10.5 2 16c0 35.3-28.7 64-64 64c-5.5 0-10.9-.7-16-2c0 .7 0 1.3 0 2c0 44.2 35.8 80 80 80zm0-208a128 128 0 1 1 0 256 128 128 0 1 1 0-256z"/></svg>

                <svg *ngIf="showPassword" class="w-5 h-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zm151 118.3C226 97.7 269.5 80 320 80c65.2 0 118.8 29.6 159.9 67.7C518.4 183.5 545 226 558.6 256c-12.6 28-36.6 66.8-70.9 100.9l-53.8-42.2c9.1-17.6 14.2-37.5 14.2-58.7c0-70.7-57.3-128-128-128c-32.2 0-61.7 11.9-84.2 31.5l-46.1-36.1zM394.9 284.2l-81.5-63.9c4.2-8.5 6.6-18.2 6.6-28.3c0-5.5-.7-10.9-2-16c.7 0 1.3 0 2 0c44.2 0 80 35.8 80 80c0 9.9-1.8 19.4-5.1 28.2zm9.4 130.3C378.8 425.4 350.7 432 320 432c-65.2 0-118.8-29.6-159.9-67.7C121.6 328.5 95 286 81.4 256c8.3-18.4 21.5-41.5 39.4-64.8L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5l-41.9-33zM192 256c0 70.7 57.3 128 128 128c13.3 0 26.1-2 38.2-5.8L302 334c-23.5-5.4-43.1-21.2-53.7-42.3l-56.1-44.2c-.2 2.8-.3 5.6-.3 8.5z"/></svg>
                </button>
            </div>

            <div *ngIf="passwordData.password" class="mt-2">
                <div class="w-full h-2 bg-gray-200 rounded">
                <div
                    [ngClass]="{
                    'bg-red-500': passwordStrength === 0,
                    'bg-orange-400': passwordStrength === 1,
                    'bg-yellow-400': passwordStrength === 2,
                    'bg-blue-400': passwordStrength === 3,
                    'bg-green-500': passwordStrength === 4
                    }"
                    class="h-full rounded transition-all duration-300"
                    [style.width.%]="(passwordStrength + 1) * 20"
                ></div>
                </div>
                <p class="text-sm mt-1"
                [ngClass]="{
                    'text-red-500': passwordStrength <= 1,
                    'text-yellow-600': passwordStrength === 2,
                    'text-blue-600': passwordStrength === 3,
                    'text-green-600': passwordStrength === 4
                }">
                {{ passwordFeedback }}
                </p>
            </div>
            </div>

            <div class="w-full">
            <label
                for="directory"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Directory</label
            >
            <select
                [(ngModel)]="passwordData.directory.id"
                name="directory"
                id="directory"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
            >
                <option [ngValue]="null" disabled selected>Select type</option>
                @for (dire of directories; track dire.id) {
                        <option [value]="dire.id">{{ dire.name }}</option>
                }
            </select>
            </div>

            <div class="w-full">
            <label
                for="type"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Type</label
            >
            <select
                [(ngModel)]="passwordData.typeElement.id"
                name="directory"
                id="type"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
            >
                <option value="" disabled selected>Select type</option>
                    @for (type of typesElement; track type.id) {
                            <option [value]="type.id">{{ type.name }}</option>
                    }
            </select>
            </div>

            <div class="sm:col-span-2">
            <label
                for="notes"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Notes</label
            >
            <textarea
                [(ngModel)]="passwordData.description"
                name="description"
                id="notes"
                rows="5"
                class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"
                placeholder="Optional notes here..."
            ></textarea>
            </div>

        </div>

        <div class="flex items-center gap-2 mt-4 sm:mt-6">
            <button
                type="submit"
                (click)="updatePassword()"
                class="bg-blue-600 text-white cursor-pointer inline-flex items-center px-5 py-2.5 text-sm font-medium text-center rounded-lg focus:ring-4 focus:ring-blue-300 hover:bg-blue-700"
            >
                Save changes
            </button>

            <button
                type="button"
                (click)="cancelEdit()"
                class="bg-gray-600 text-white cursor-pointer inline-flex items-center px-5 py-2.5 text-sm font-medium text-center rounded-lg focus:ring-4 focus:ring-gray-300 hover:bg-gray-700"
            >
                Cancel
            </button>
        </div>
        

        </form>
    </div>
    </section>
